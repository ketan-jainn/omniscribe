version: '3.8'

services:
  # --- Database Layer ---
  postgres:
    image: postgres:16-alpine
    container_name: omniscribe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: omniscribe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omniscribe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Caching, Rate Limiting & Scheduler State ---
  redis:
    image: redis:7-alpine
    container_name: omniscribe-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Object Storage (S3 Mock) ---
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: omniscribe-minio
    entrypoint: sh
    command: -c "mkdir -p /data/omniscribe-chunks && minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000" # API Port
      - "9002:9001" # Console/UI Port
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Message Broker (Kafka API) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5
    container_name: omniscribe-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"   # Exposed to local host
      - "8082:8082"   # Redpanda HTTP Proxy API
      - "19644:9644" # Redpanda Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Spring Boot API Service ---
  spring-boot-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: omniscribe-spring-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/omniscribe_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_password
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SERVER_PORT: 8080
      OMNISCRIBE_SCHEDULER_ENABLED: "false"
      OMNISCRIBE_WORKER_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # --- Spring Boot Scheduler Service ---
  spring-boot-scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: omniscribe-spring-scheduler
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/omniscribe_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_password
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SERVER_PORT: 8081
      OMNISCRIBE_SCHEDULER_ENABLED: "true"
      OMNISCRIBE_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # --- Spring Boot Worker Service ---
  spring-boot-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: omniscribe-spring-worker
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/omniscribe_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres_password
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SERVER_PORT: 8082
      OMNISCRIBE_SCHEDULER_ENABLED: "false"
      OMNISCRIBE_WORKER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  redpanda_data:
    driver: local
