spring:
  application:
    name: omniscribe-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:omniscribetestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

omniscribe:
  scheduler:
    enabled: false
  worker:
    enabled: false

server:
  port: 0

logging:
  level:
    root: INFO
    com.omniscribe: DEBUG
